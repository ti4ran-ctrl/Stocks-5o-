<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מעקב מניות, מגמות וניהול תיק אוטומטי</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #556070;
      --line: #e2e8f0;
      --accent: #0f766e;
      --accent-soft: #ecfdf5;
      --entry-bg: #f0fdf4;
      --entry-line: #bbf7d0;
      --exit-bg: #fffbeb;
      --exit-line: #fde68a;
      --stop-bg: #fef2f2;
      --stop-line: #fecaca;
      --closed-bg: #f1f5f9;
      --closed-line: #cbd5e1;
      --ok: #15803d;
      --warn: #b45309;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 14px 60px;
    }
    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .top h1 { margin: 0; font-size: 1.22rem; font-weight: 800; }
    .meta { font-size: 0.84rem; color: var(--muted); }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding-bottom: 4px;
    }
    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input, select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }
    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }
    button.btn {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    button.btn.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #a7f3d0;
    }
    button.btn.danger {
      background: var(--stop-bg);
      color: var(--bad);
      border: 1px solid var(--stop-line);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .ticker-title { font-size: 1.08rem; font-weight: 800; }
    .price-now { font-size: 1.08rem; font-weight: 800; text-align: left; }
    .badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .badge.gray {
      background: #e2e8f0;
      color: #334155;
    }
    .no-entry-banner {
      background: var(--stop-bg);
      border: 1.5px solid var(--stop-line);
      color: var(--bad);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .no-entry-big { font-size: 1.15rem; font-weight: 900; }
    .no-entry-sub { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-top: 2px; }
    .bar-block {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 11px;
    }
    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 999px; }
    .fill-ok { background: linear-gradient(90deg, #16a34a, #0f766e); }
    .fill-warn { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .fill-bad { background: linear-gradient(90deg, #ef4444, #b91c1c); }
    .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .entry-box {
      background: var(--entry-bg);
      border: 1px solid var(--entry-line);
      border-radius: 11px;
      padding: 9px 10px;
    }
    .exit-box {
      background: var(--exit-bg);
      border: 1px solid var(--exit-line);
      border-radius: 11px;
      padding: 9px 10px;
    }
    .box-label { font-size: 0.76rem; font-weight: 700; color: var(--muted); }
    .box-val { font-size: 1.05rem; font-weight: 800; margin: 2px 0; }
    .box-pct { font-size: 0.78rem; font-weight: 700; }
    .news-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 0.8rem;
    }
    .news-title { margin-top: 4px; color: var(--text); font-weight: 600; }
    .sub-levels {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .kpi-val { font-size: 1.12rem; font-weight: 800; margin-top: 2px; }
    .pos { color: var(--ok); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    .neg { color: var(--bad); font-weight: 700; }
    .hidden { display: none; }
    .list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .list-row:last-child { border-bottom: none; }
    .closed-row {
      background: var(--closed-bg);
      border: 1px solid var(--closed-line);
      border-radius: 11px;
      margin-bottom: 8px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>מערכת סריקה, מגמות וניהול תיק אוטומטי</h1>
        <div class="meta" id="syncStatus">טוען נתוני סנכרון מ-Yahoo Finance...</div>
      </div>
      <button class="btn secondary" onclick="loadSyncedData()">רענן סנכרון</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="scan" onclick="switchTab('scan')">סריקה ותוצאות</button>
      <button class="tab" data-tab="bot-demo" onclick="switchTab('bot-demo')">תיק אוטומטי ורווחים</button>
      <button class="tab" data-tab="watchlist" onclick="switchTab('watchlist')">רשימת מעקב</button>
      <button class="tab" data-tab="my-demo" onclick="switchTab('my-demo')">תיק דמו ידני</button>
    </div>

    <section id="tab-scan" class="card">
      <div class="row">
        <div>
          <label for="filterTicker">חיפוש סימול מניה</label>
          <input id="filterTicker" placeholder="הקלד כל סימול..." oninput="renderScanResults()" />
        </div>
        <div>
          <label for="filterVerdict">סינון מצב כניסה/פריצה</label>
          <select id="filterVerdict" onchange="renderScanResults()">
            <option value="ALL">הכל</option>
            <option value="APPROVED">מאושר לכניסה</option>
            <option value="BREAKOUT">המתן לפריצה בשער</option>
            <option value="NO_ENTRY">לא להיכנס</option>
          </select>
        </div>
        <div>
          <label for="minProfitPct">רווח מינימלי נדרש (%)</label>
          <input id="minProfitPct" type="number" step="0.5" min="0" max="100" value="6" style="width:110px" oninput="renderScanResults()" />
        </div>
        <div>
          <label class="check-label">
            <input id="onlyMinProfit" type="checkbox" checked onchange="renderScanResults()" />
            הצג רק מניות עם רווח מינימלי של <span id="minProfitBadge">6%</span>
          </label>
        </div>
      </div>
      <div class="grid" id="scanGrid"></div>
    </section>

    <section id="tab-bot-demo" class="card hidden">
      <div class="row" style="margin-bottom:14px;">
        <div>
          <label for="botInitCapInput">הון התחלתי לתיק האוטומטי ($)</label>
          <input id="botInitCapInput" type="number" min="100" step="100" value="10000" style="width:140px" />
        </div>
        <button class="btn danger" onclick="resetBotPortfolio()">אפס תיק אוטומטי</button>
        <button class="btn secondary" onclick="clearBotOverrides()">בטל איפוס/הסרות מקומיות</button>
      </div>
      <div class="meta" id="botOverrideNote" style="margin-bottom:10px;"></div>
      <div id="botDemoContent"></div>
    </section>

    <section id="tab-watchlist" class="card hidden">
      <div class="row">
        <div>
          <label for="watchInput">הוסף מניה למעקב וקנייה/מכירה אוטומטית</label>
          <input id="watchInput" placeholder="למשל AAPL" />
        </div>
        <button class="btn" onclick="addToWatchlist()">הוסף למעקב</button>
      </div>
      <div class="meta" id="watchlistSecretHelper" style="margin-top:8px;"></div>
      <div id="watchlistContainer" style="margin-top:12px;"></div>
    </section>

    <section id="tab-my-demo" class="card hidden">
      <div class="row" style="margin-bottom:14px;">
        <div>
          <label for="myCapitalInput">גודל התיק ההתחלתי ($)</label>
          <input id="myCapitalInput" type="number" min="100" step="100" value="10000" onchange="saveMyCapital()" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="buyTicker">מניה</label>
          <input id="buyTicker" placeholder="NVDA" style="width:100px" />
        </div>
        <div>
          <label for="buyAmount">סכום השקעה ($)</label>
          <input id="buyAmount" type="number" min="1" step="10" placeholder="2000" style="width:115px" />
        </div>
        <div>
          <label for="buyPrice">שער קנייה מבוקש ($)</label>
          <input id="buyPrice" type="number" min="0.01" step="0.01" placeholder="135.00" style="width:130px" />
        </div>
        <div>
          <label for="sellTargetPrice">שער מכירה / יעד ($)</label>
          <input id="sellTargetPrice" type="number" min="0.01" step="0.01" placeholder="143.10" style="width:130px" />
        </div>
        <button class="btn" onclick="placeManualBuyOrder()">הצב פקודת קנייה</button>
      </div>
      <div id="myDemoSummary" class="meta" style="margin-top:14px;"></div>
      <div id="myDemoPending" style="margin-top:10px;"></div>
      <div id="myDemoOpen" style="margin-top:10px;"></div>
      <div id="myDemoClosed" style="margin-top:14px;"></div>
    </section>
  </div>

  <script>
    let scanData = { updatedAt: "", results: [] };
    let botPortfolio = { initial_capital: 10000, cash: 10000, pending_orders: [], open_positions: [], closed_positions: [], summary: {} };

    let watchlist = JSON.parse(localStorage.getItem("user_watchlist") || '["NVDA","PLTR","COIN"]');
    let myCapital = Number(localStorage.getItem("my_demo_capital") || 10000);
    let myDemoState = JSON.parse(localStorage.getItem("my_demo_state_v2") || "null");
    if (!myDemoState) {
      myDemoState = { pending: [], open: [], closed: [], nextActionNum: 1 };
    }

    let botRemovedTickers = JSON.parse(localStorage.getItem("bot_removed_tickers") || "[]");
    let botResetCapital = localStorage.getItem("bot_reset_capital") ? Number(localStorage.getItem("bot_reset_capital")) : null;

    document.getElementById("myCapitalInput").value = myCapital;

    function switchTab(tabName) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tabName));
      ["scan", "bot-demo", "watchlist", "my-demo"].forEach(id => {
        document.getElementById("tab-" + id).classList.toggle("hidden", id !== tabName);
      });
    }

    function formatUpdatedTime(utcStr) {
      if (!utcStr) return "לא ידוע";
      try {
        const iso = utcStr.includes("T") ? utcStr : utcStr.replace(" ", "T") + ":00Z";
        const d = new Date(iso);
        if (!isNaN(d.getTime())) {
          const ilStr = d.toLocaleString("he-IL", { timeZone: "Asia/Jerusalem", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
          return `${ilStr} (שעון ישראל) | ${utcStr}`;
        }
      } catch (_) {}
      return utcStr;
    }

    async function loadSyncedData() {
      const statusEl = document.getElementById("syncStatus");
      try {
        const [scanRes, demoRes] = await Promise.all([
          fetch("./latest_scan.json?t=" + Date.now()),
          fetch("./demo_portfolio.json?t=" + Date.now())
        ]);
        if (scanRes.ok) {
          scanData = await scanRes.json();
          statusEl.textContent = `מסונכרן עם Yahoo Finance וידיעות ברשת | עדכון אחרון: ${formatUpdatedTime(scanData.updatedAt)} (${scanData.results?.length || 0} מניות)`;
        } else {
          statusEl.textContent = "ממתין להרצת סריקה ראשונה ב-GitHub Actions (latest_scan.json)";
        }
        if (demoRes.ok) {
          botPortfolio = await demoRes.json();
        }
      } catch (err) {
        statusEl.textContent = "מצב מקומי / לא מחובר לשרת";
      }
      processManualDemoTriggers();
      renderScanResults();
      renderWatchlist();
      renderMyDemo();
      renderBotDemo();
    }

    function matchVerdictFilter(verdictText, filterVal) {
      const v = String(verdictText || "");
      if (filterVal === "ALL") return true;
      if (filterVal === "APPROVED") return v.includes("מאושר");
      if (filterVal === "BREAKOUT") return v.includes("פריצה");
      if (filterVal === "NO_ENTRY") return v.includes("לא להיכנס");
      return true;
    }

    function renderScanResults() {
      const query = (document.getElementById("filterTicker").value || "").trim().toUpperCase();
      const verdictFilter = document.getElementById("filterVerdict").value || "ALL";
      const minProfitPct = Math.max(0, Number(document.getElementById("minProfitPct").value || 6));
      const onlyMinProfit = document.getElementById("onlyMinProfit").checked;
      document.getElementById("minProfitBadge").textContent = `${minProfitPct}%`;

      const grid = document.getElementById("scanGrid");

      const items = (scanData.results || []).filter(r => {
        const matchTicker = !query || String(r.ticker || "").includes(query);
        const matchVerdict = matchVerdictFilter(r.gateVerdict, verdictFilter);
        const entry = Number(r.entry || r.price || 0);
        const target = Number(r.targetPrice || entry * (1 + minProfitPct / 100));
        const gainPct = entry > 0 ? ((target - entry) / entry) * 100 : Number(r.targetPct || 0);
        const matchProfit = !onlyMinProfit || gainPct >= minProfitPct;
        return matchTicker && matchVerdict && matchProfit;
      });

      if (!items.length) {
        grid.innerHTML = `<div class="meta">אין מניות שעומדות בסינון או ביעד הרווח של ${minProfitPct}% כרגע. נסה להוריד את סף הרווח או לבטל את הסינון.</div>`;
        return;
      }

      grid.innerHTML = items.map(r => {
        const currPrice = Number(r.price || 0);
        const entry = Number(r.entry || currPrice);
        const stopLoss = Number(r.stopLoss || 0);
        const targetPrice = Number(r.targetPrice || (entry * 1.06));
        const gainPct = entry > 0 ? ((targetPrice - entry) / entry) * 100 : Number(r.targetPct || 6);
        const recExit = Number(r.recommendedExit || targetPrice);
        const chg = Number(r.changePct || 0);
        const chgClass = chg >= 0 ? "pos" : "neg";
        const sentLabel = r.sentiment?.label || "מעורב";
        const scorePct = Math.max(0, Math.min(100, Number(r.scorePct || 0)));
        const isNoEntry = String(r.gateVerdict || "").includes("לא להיכנס");
        const isBreakoutWait = String(r.gateVerdict || "").includes("פריצה");

        const deltaEntryPct = Number(r.deltaToEntryPct ?? (((entry - currPrice) / Math.max(currPrice, 0.01)) * 100));
        const entryPctLabel = `${deltaEntryPct >= 0 ? "+" : ""}${deltaEntryPct.toFixed(1)}% מול מחיר נוכחי`;

        const exitDiffPct = (((recExit - entry) / Math.max(entry, 0.01)) * 100);
        const exitPctLabel = `${exitDiffPct >= 0 ? "+" : ""}${exitDiffPct.toFixed(1)}% מול שער כניסה`;

        const fillClass = isNoEntry ? "fill-bad" : (isBreakoutWait ? "fill-warn" : (scorePct >= 65 ? "fill-ok" : "fill-warn"));

        const newsObj = r.news || {};
        const newsSummary = newsObj.summaryHe || "ללא ידיעות";
        const topHeadline = (newsObj.items && newsObj.items[0] && newsObj.items[0].title) ? newsObj.items[0].title : "";

        const bannerHtml = isNoEntry ? `
          <div class="no-entry-banner">
            <div class="no-entry-big">לא להיכנס</div>
            <div class="no-entry-sub">${r.waitInstruction || `להמתין שירד לשער $${entry.toFixed(2)} ואז להיכנס`}</div>
          </div>
        ` : (isBreakoutWait ? `
          <div class="bar-block" style="border-color:#fde68a;background:#fffbeb;">
            <div class="warn" style="font-size:0.9rem;">המתן להתבססות ולפריצה מעל $${entry.toFixed(2)}</div>
            <div class="meta">קנייה מאושרת רק בשער הפריצה • יעד צפוי +${gainPct.toFixed(1)}%</div>
          </div>
        ` : "");

        return `
          <div class="item">
            <div class="item-head">
              <div>
                <div class="ticker-title">${r.ticker} <span class="badge">${sentLabel}</span></div>
                <div class="meta">${r.gateVerdict || ""}</div>
              </div>
              <div class="price-now">
                $${currPrice.toFixed(2)}
                <div class="meta ${chgClass}">${chg >= 0 ? "+" : ""}${chg.toFixed(1)}%</div>
              </div>
            </div>

            ${bannerHtml}

            <div class="bar-block">
              <div class="bar-labels">
                <span>ציון 66 בדיקות: ${scorePct.toFixed(0)}%</span>
                <span>רווח ליעד: +${gainPct.toFixed(1)}%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill ${fillClass}" style="width:${scorePct.toFixed(0)}%"></div>
              </div>
              <div class="sub-levels" style="margin-top:6px;">
                <span>סטופ: <b>$${stopLoss.toFixed(2)}</b> (-${Number(r.stopPct || 0).toFixed(1)}%)</span>
                <span>יעד: <b>$${targetPrice.toFixed(2)}</b> (+${gainPct.toFixed(1)}%)</span>
              </div>
            </div>

            <div class="io-grid">
              <div class="entry-box">
                <div class="box-label">${isBreakoutWait ? "שער פריצה לכניסה" : (isNoEntry ? "שער כניסה להמתנה" : "שער כניסה")}</div>
                <div class="box-val">$${entry.toFixed(2)}</div>
                <div class="box-pct ${isBreakoutWait || isNoEntry ? "warn" : "pos"}">${entryPctLabel}</div>
                <div class="meta">${r.entryType || ""}</div>
              </div>

              <div class="exit-box">
                <div class="box-label">שער יציאה (${r.exitAction || "יעד"})</div>
                <div class="box-val">$${recExit.toFixed(2)}</div>
                <div class="box-pct warn">${exitPctLabel}</div>
                <div class="meta">יחס 1:${r.rrRatio || "-"}</div>
              </div>
            </div>

            <div class="news-box">
              <div><b>ידיעות ברשת:</b> ${newsSummary}</div>
              ${topHeadline ? `<div class="news-title">${topHeadline}</div>` : ""}
            </div>

            <div class="sub-levels">
              <span>פריצה: <b>$${Number(r.breakoutLevel || currPrice).toFixed(2)}</b></span>
              <span>תמיכה: <b>$${Number(r.supportLevel || stopLoss).toFixed(2)}</b></span>
              <button class="btn secondary" style="padding:5px 10px;font-size:0.78rem;" onclick="quickWatch('${r.ticker}')">+ למעקב</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function removeBotPosition(ticker) {
      const t = String(ticker || "").toUpperCase();
      if (!t) return;
      if (!botRemovedTickers.includes(t)) {
        botRemovedTickers.push(t);
        localStorage.setItem("bot_removed_tickers", JSON.stringify(botRemovedTickers));
      }
      renderBotDemo();
    }

    function resetBotPortfolio() {
      const cap = Math.max(100, Number(document.getElementById("botInitCapInput").value || 10000));
      botResetCapital = cap;
      botRemovedTickers = [];
      localStorage.setItem("bot_reset_capital", String(cap));
      localStorage.setItem("bot_removed_tickers", "[]");
      renderBotDemo();
    }

    function clearBotOverrides() {
      botResetCapital = null;
      botRemovedTickers = [];
      localStorage.removeItem("bot_reset_capital");
      localStorage.removeItem("bot_removed_tickers");
      renderBotDemo();
    }

    function quickWatch(ticker) {
      if (!watchlist.includes(ticker)) {
        watchlist.push(ticker);
        localStorage.setItem("user_watchlist", JSON.stringify(watchlist));
        renderWatchlist();
      }
      switchTab("watchlist");
    }

    function addToWatchlist() {
      const input = document.getElementById("watchInput");
      const t = (input.value || "").trim().toUpperCase();
      if (!t) return;
      if (!watchlist.includes(t)) {
        watchlist.push(t);
        localStorage.setItem("user_watchlist", JSON.stringify(watchlist));
      }
      input.value = "";
      renderWatchlist();
    }

    function removeFromWatchlist(t) {
      watchlist = watchlist.filter(x => x !== t);
      localStorage.setItem("user_watchlist", JSON.stringify(watchlist));
      renderWatchlist();
    }

    function renderWatchlist() {
      const container = document.getElementById("watchlistContainer");
      const helper = document.getElementById("watchlistSecretHelper");
      helper.textContent = watchlist.length
        ? `לסריקה וקנייה/מכירה אוטומטית של המניות שלך ב-GitHub Actions, הגדר Secret בשם WATCHLIST_TICKERS: ${watchlist.join(",")}`
        : "";

      if (!watchlist.length) {
        container.innerHTML = `<div class="meta">רשימת המעקב ריקה.</div>`;
        return;
      }
      container.innerHTML = watchlist.map(t => {
        const found = (scanData.results || []).find(r => r.ticker === t);
        const p = found ? Number(found.price) : null;
        const actionTxt = found
          ? (String(found.gateVerdict || "").includes("לא להיכנס")
              ? ` | <span class="neg">לא להיכנס</span> — ${found.waitInstruction || ""}`
              : ` | <b>${found.gateVerdict}</b>: כניסה <b>$${Number(found.entry).toFixed(2)}</b> | יציאה: <b>$${Number(found.recommendedExit || found.targetPrice).toFixed(2)}</b>`)
          : "";
        return `
          <div class="list-row">
            <div><b>${t}</b> ${p ? `— $${p.toFixed(2)}${actionTxt}` : "(אין נתון עדכני בסריקה האחרונה)"}</div>
            <button class="btn secondary" onclick="removeFromWatchlist('${t}')">הסר</button>
          </div>
        `;
      }).join("");
    }

    function saveMyCapital() {
      myCapital = Math.max(100, Number(document.getElementById("myCapitalInput").value || 10000));
      localStorage.setItem("my_demo_capital", String(myCapital));
      renderMyDemo();
    }

    function saveMyDemoState() {
      localStorage.setItem("my_demo_state_v2", JSON.stringify(myDemoState));
    }

    function allocManualActionNum() {
      const n = Number(myDemoState.nextActionNum || 1);
      myDemoState.nextActionNum = n + 1;
      return n;
    }

    function getLivePriceFor(ticker) {
      const found = (scanData.results || []).find(r => String(r.ticker || "").toUpperCase() === String(ticker || "").toUpperCase());
      return found ? Number(found.price) : null;
    }

    function placeManualBuyOrder() {
      const ticker = (document.getElementById("buyTicker").value || "").trim().toUpperCase();
      const amount = Number(document.getElementById("buyAmount").value || 0);
      const entryPrice = Number(document.getElementById("buyPrice").value || 0);
      const sellTarget = Number(document.getElementById("sellTargetPrice").value || (entryPrice * 1.06));
      if (!ticker || amount <= 0 || entryPrice <= 0) return;

      const actNum = allocManualActionNum();
      myDemoState.pending.push({
        id: Date.now(),
        actionNum: actNum,
        ticker,
        amount,
        entryPrice,
        sellTarget: sellTarget > 0 ? sellTarget : Number((entryPrice * 1.06).toFixed(2)),
        createdAt: new Date().toLocaleString("he-IL")
      });
      saveMyDemoState();
      document.getElementById("buyTicker").value = "";
      document.getElementById("buyAmount").value = "";
      document.getElementById("buyPrice").value = "";
      document.getElementById("sellTargetPrice").value = "";
      processManualDemoTriggers();
      renderMyDemo();
    }

    function fillManualOrderNow(orderId) {
      const ord = myDemoState.pending.find(o => o.id === orderId);
      if (!ord) return;
      myDemoState.pending = myDemoState.pending.filter(o => o.id !== orderId);
      myDemoState.open.push({
        id: ord.id,
        actionNum: ord.actionNum,
        ticker: ord.ticker,
        amount: ord.amount,
        shares: ord.amount / ord.entryPrice,
        buyPrice: ord.entryPrice,
        sellTarget: ord.sellTarget,
        boughtAt: new Date().toLocaleString("he-IL")
      });
      saveMyDemoState();
      renderMyDemo();
    }

    function closeManualPositionAtPrice(posId, exitPriceVal, reasonText) {
      const pos = myDemoState.open.find(p => p.id === posId);
      if (!pos) return;
      const exitPrice = Number(exitPriceVal);
      if (!(exitPrice > 0)) return;
      const pnlDollar = (exitPrice - pos.buyPrice) * pos.shares;
      const pnlPct = ((exitPrice - pos.buyPrice) / pos.buyPrice) * 100;
      myDemoState.open = myDemoState.open.filter(p => p.id !== posId);
      myDemoState.closed.push({
        ...pos,
        exitPrice,
        pnlDollar,
        pnlPct,
        reason: reasonText || "מכירה ידנית",
        closedAt: new Date().toLocaleString("he-IL")
      });
      saveMyDemoState();
    }

    function promptManualSell(posId) {
      const pos = myDemoState.open.find(p => p.id === posId);
      if (!pos) return;
      const live = getLivePriceFor(pos.ticker);
      const defVal = live ? live.toFixed(2) : Number(pos.sellTarget || pos.buyPrice).toFixed(2);
      const raw = prompt(`באיזה שער מכרת את ${pos.ticker} ($)?`, defVal);
      if (!raw) return;
      closeManualPositionAtPrice(posId, Number(raw), "מכירה ידנית");
      renderMyDemo();
    }

    function updateManualSellTarget(posId) {
      const pos = myDemoState.open.find(p => p.id === posId);
      if (!pos) return;
      const raw = prompt(`שער מכירה / יעד חדש עבור ${pos.ticker} ($):`, Number(pos.sellTarget || pos.buyPrice * 1.06).toFixed(2));
      if (!raw) return;
      const val = Number(raw);
      if (!(val > 0)) return;
      pos.sellTarget = val;
      saveMyDemoState();
      processManualDemoTriggers();
      renderMyDemo();
    }

    function processManualDemoTriggers() {
      let changed = false;
      const stillPending = [];
      for (const ord of myDemoState.pending) {
        const live = getLivePriceFor(ord.ticker);
        if (live !== null && live <= ord.entryPrice) {
          myDemoState.open.push({
            id: ord.id,
            actionNum: ord.actionNum,
            ticker: ord.ticker,
            amount: ord.amount,
            shares: ord.amount / ord.entryPrice,
            buyPrice: ord.entryPrice,
            sellTarget: ord.sellTarget,
            boughtAt: new Date().toLocaleString("he-IL")
          });
          changed = true;
        } else {
          stillPending.push(ord);
        }
      }
      myDemoState.pending = stillPending;

      const stillOpen = [];
      for (const pos of myDemoState.open) {
        const live = getLivePriceFor(pos.ticker);
        if (live !== null && pos.sellTarget > 0 && live >= pos.sellTarget) {
          const exitP = Math.max(live, pos.sellTarget);
          const pnlDollar = (exitP - pos.buyPrice) * pos.shares;
          const pnlPct = ((exitP - pos.buyPrice) / pos.buyPrice) * 100;
          myDemoState.closed.push({
            ...pos,
            exitPrice: exitP,
            pnlDollar,
            pnlPct,
            reason: `הגיעה לשער מכירה $${pos.sellTarget.toFixed(2)}`,
            closedAt: new Date().toLocaleString("he-IL")
          });
          changed = true;
        } else {
          stillOpen.push(pos);
        }
      }
      myDemoState.open = stillOpen;
      if (changed) saveMyDemoState();
    }

    function renderMyDemo() {
      const summaryEl = document.getElementById("myDemoSummary");
      const pendingEl = document.getElementById("myDemoPending");
      const openEl = document.getElementById("myDemoOpen");
      const closedEl = document.getElementById("myDemoClosed");

      const realizedPnl = myDemoState.closed.reduce((acc, c) => acc + Number(c.pnlDollar || 0), 0);
      let openMarketVal = 0;
      let openCostBasis = 0;
      let unrealizedPnl = 0;

      for (const pos of myDemoState.open) {
        const live = getLivePriceFor(pos.ticker);
        const curr = live !== null ? live : pos.buyPrice;
        openCostBasis += pos.amount;
        openMarketVal += curr * pos.shares;
        unrealizedPnl += (curr - pos.buyPrice) * pos.shares;
      }

      const pendingReserved = myDemoState.pending.reduce((acc, o) => acc + Number(o.amount || 0), 0);
      const cash = myCapital - openCostBasis - pendingReserved + realizedPnl;
      const totalEquity = cash + openMarketVal;
      const totalPnl = totalEquity - myCapital;
      const totalReturnPct = (totalPnl / Math.max(myCapital, 1)) * 100;

      summaryEl.innerHTML = `
        הון התחלתי: <b>$${myCapital.toLocaleString()}</b> |
        שווי תיק: <b>$${totalEquity.toLocaleString(undefined, { maximumFractionDigits: 0 })}</b> |
        מזומן פנוי: <b>$${cash.toLocaleString(undefined, { maximumFractionDigits: 0 })}</b> |
        רווח/הפסד כללי: <span class="${totalPnl >= 0 ? "pos" : "neg"}">${totalPnl >= 0 ? "+" : ""}$${totalPnl.toFixed(2)} (${totalReturnPct >= 0 ? "+" : ""}${totalReturnPct.toFixed(2)}%)</span>
      `;

      if (!myDemoState.pending.length) {
        pendingEl.innerHTML = "";
      } else {
        pendingEl.innerHTML = `<h3 style="margin:8px 0 6px;font-size:1rem;">פקודות קנייה ממתינות (ייקנו אוטומטית בהגעה לשער הכניסה)</h3>` +
          myDemoState.pending.map(o => {
            const live = getLivePriceFor(o.ticker);
            return `
              <div class="list-row">
                <div>
                  <span class="badge">פעולה #${o.actionNum}</span> <b>${o.ticker}</b> | ממתין לכניסה ב-<b>$${o.entryPrice.toFixed(2)}</b> | יעד מכירה: <b>$${o.sellTarget.toFixed(2)}</b> | סכום: $${o.amount.toFixed(0)}<br/>
                  <span class="meta">${live !== null ? `מחיר נוכחי: $${live.toFixed(2)}` : "ממתין לנתון מחיר"}</span>
                </div>
                <button class="btn secondary" style="padding:5px 10px;font-size:0.78rem;" onclick="fillManualOrderNow(${o.id})">סמן כנקנה עכשיו</button>
              </div>
            `;
          }).join("");
      }

      if (!myDemoState.open.length) {
        openEl.innerHTML = `<div class="meta" style="margin-top:8px;">אין פוזיציות פתוחות בתיק הדמו הידני.</div>`;
      } else {
        openEl.innerHTML = `<h3 style="margin:8px 0 6px;font-size:1rem;">פוזיציות פתוחות (יימכרו אוטומטית בהגעה לשער המכירה)</h3>` +
          myDemoState.open.map(pos => {
            const live = getLivePriceFor(pos.ticker);
            const curr = live !== null ? live : pos.buyPrice;
            const pnl = (curr - pos.buyPrice) * pos.shares;
            const pnlPct = ((curr - pos.buyPrice) / pos.buyPrice) * 100;
            return `
              <div class="list-row">
                <div>
                  <span class="badge">פעולה #${pos.actionNum}</span> <b>${pos.ticker}</b> | נקנה ב-<b>$${pos.buyPrice.toFixed(2)}</b> | שער מכירה: <b>$${pos.sellTarget.toFixed(2)}</b><br/>
                  <span class="meta">עכשיו: $${curr.toFixed(2)} | סכום: $${pos.amount.toFixed(0)}</span>
                </div>
                <div style="text-align:left;">
                  <div class="${pnl >= 0 ? "pos" : "neg"}">${pnl >= 0 ? "+" : ""}$${pnl.toFixed(2)} (${pnlPct >= 0 ? "+" : ""}${pnlPct.toFixed(1)}%)</div>
                  <div style="display:flex;gap:6px;margin-top:4px;justify-content:flex-end;">
                    <button class="btn secondary" style="padding:4px 9px;font-size:0.76rem;" onclick="updateManualSellTarget(${pos.id})">שנה יעד</button>
                    <button class="btn secondary" style="padding:4px 9px;font-size:0.76rem;" onclick="promptManualSell(${pos.id})">מכור</button>
                  </div>
                </div>
              </div>
            `;
          }).join("");
      }

      if (!myDemoState.closed.length) {
        closedEl.innerHTML = "";
      } else {
        closedEl.innerHTML = `<h3 style="margin:14px 0 6px;font-size:1rem;">עסקאות סגורות (רווח/הפסד ממומש בתיק)</h3>` +
          myDemoState.closed.slice().reverse().map(c => {
            const pnlD = Number(c.pnlDollar || 0);
            const pnlP = Number(c.pnlPct || 0);
            return `
              <div class="list-row closed-row">
                <div>
                  <span class="badge gray">פעולה #${c.actionNum}</span> <b>${c.ticker}</b> — כניסה $${Number(c.buyPrice).toFixed(2)} ← מכירה $${Number(c.exitPrice).toFixed(2)}<br/>
                  <span class="meta">${c.reason || "נסגרה"} • ${c.closedAt || ""}</span>
                </div>
                <div style="text-align:left;" class="${pnlD >= 0 ? "pos" : "neg"}">${pnlD >= 0 ? "+" : ""}$${pnlD.toFixed(2)} (${pnlP >= 0 ? "+" : ""}${pnlP.toFixed(1)}%)</div>
              </div>
            `;
          }).join("");
      }
    }

    function renderBotDemo() {
      const noteEl = document.getElementById("botOverrideNote");
      const rawPending = botResetCapital !== null ? [] : (botPortfolio.pending_orders || []);
      const rawOpen = botResetCapital !== null ? [] : (botPortfolio.open_positions || []);
      const rawClosed = botResetCapital !== null ? [] : (botPortfolio.closed_positions || []);

      const pendingList = rawPending.filter(o => !botRemovedTickers.includes(String(o.ticker || "").toUpperCase()));
      const openList = rawOpen.filter(p => !botRemovedTickers.includes(String(p.ticker || "").toUpperCase()));
      const closedList = rawClosed.filter(c => !botRemovedTickers.includes(String(c.ticker || "").toUpperCase()));

      const sum = botPortfolio.summary || {};
      const initCap = botResetCapital !== null ? botResetCapital : Number(sum.initial_capital ?? botPortfolio.initial_capital ?? 10000);
      document.getElementById("botInitCapInput").value = initCap;

      const noteParts = [];
      if (botResetCapital !== null) noteParts.push(`תיק אופס להון התחלתי של $${initCap.toLocaleString()}`);
      if (botRemovedTickers.length) noteParts.push(`הוסרו מניות: ${botRemovedTickers.join(", ")}`);
      noteParts.push(`לסנכרון קבוע ב-GitHub Actions: ניתן להגדיר Secrets בשם RESET_DEMO_PORTFOLIO=true או REMOVE_DEMO_TICKERS`);
      noteEl.textContent = noteParts.join(" • ");

      let calcOpenVal = 0;
      let calcAllocated = 0;

      const enrichedOpen = openList.map((p, idx) => {
        const liveItem = (scanData.results || []).find(r => r.ticker === p.ticker);
        const curr = liveItem ? Number(liveItem.price) : Number(p.current_price || p.entry);
        const entry = Number(p.entry || curr);
        const chosenEntry = Number(p.chosen_entry || entry);
        const shares = Number(p.shares || (Number(p.allocated || 1500) / Math.max(entry, 0.01)));
        const alloc = shares * entry;
        const pnlDollar = (curr - entry) * shares;
        const pnlPct = ((curr - entry) / Math.max(entry, 0.01)) * 100;
        const dynExit = liveItem ? Number(liveItem.recommendedExit || p.exit_price_target || p.target_price) : Number(p.exit_price_target || p.target_price);
        const chosenExit = Number(p.chosen_exit || dynExit);
        const actNum = p.action_num || (idx + 1);
        calcOpenVal += curr * shares;
        calcAllocated += alloc;
        return { ...p, actNum, curr, entry, chosenEntry, shares, alloc, pnlDollar, pnlPct, dynExit, chosenExit };
      });

      const realizedPnl = closedList.reduce((acc, c) => acc + Number(c.pnl_dollar || 0), 0);
      const hasOverrides = (botResetCapital !== null) || (botRemovedTickers.length > 0);
      const cash = hasOverrides
        ? Math.max(0, initCap - calcAllocated + realizedPnl)
        : Number(sum.cash ?? botPortfolio.cash ?? Math.max(0, initCap - calcAllocated));
      const totalEquity = hasOverrides
        ? (cash + calcOpenVal)
        : Number(sum.total_equity ?? (cash + calcOpenVal));
      const totalPnlDollar = totalEquity - initCap;
      const totalPnlPct = (totalPnlDollar / Math.max(initCap, 1)) * 100;
      const wins = closedList.filter(c => c.result === "WIN").length;
      const winRate = closedList.length ? ((wins / closedList.length) * 100).toFixed(1) : "0.0";

      let html = `
        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="box-label">רווח / הפסד בטוטאל תיק</div>
            <div class="kpi-val ${totalPnlDollar >= 0 ? "pos" : "neg"}">${totalPnlDollar >= 0 ? "+" : ""}$${totalPnlDollar.toFixed(2)} (${totalPnlPct >= 0 ? "+" : ""}${totalPnlPct.toFixed(2)}%)</div>
          </div>
          <div class="kpi-box">
            <div class="box-label">שווי תיק כולל</div>
            <div class="kpi-val">$${totalEquity.toLocaleString(undefined, { maximumFractionDigits: 0 })}</div>
          </div>
          <div class="kpi-box">
            <div class="box-label">מזומן פנוי / רווח ממומש</div>
            <div class="kpi-val">$${cash.toLocaleString(undefined, { maximumFractionDigits: 0 })} <span class="meta">(${realizedPnl >= 0 ? "+" : ""}$${realizedPnl.toFixed(0)}$)</span></div>
          </div>
          <div class="kpi-box">
            <div class="box-label">פתוחות / סגורות / הצלחה</div>
            <div class="kpi-val">${enrichedOpen.length} / ${closedList.length} <span class="meta">(${winRate}%)</span></div>
          </div>
        </div>
      `;

      if (pendingList.length) {
        html += `<h3 style="margin:8px 0 6px;font-size:1rem;">פקודות כניסה אוטומטיות ממתינות לשער שבחרה המערכת</h3>`;
        html += pendingList.map((o, idx) => {
          const actNum = o.action_num || (idx + 1);
          return `
            <div class="list-row">
              <div>
                <span class="badge">פעולה #${actNum}</span> <b>${o.ticker}</b> <span class="badge">${o.source || "אוטומטי"}</span><br/>
                <span class="meta">כניסה שנבחרה: <b>$${Number(o.chosen_entry || o.entry_target || 0).toFixed(2)}</b> (עכשיו $${Number(o.current_price || 0).toFixed(2)}) | יציאה שנבחרה: <b>$${Number(o.chosen_exit || o.target_price || 0).toFixed(2)}</b></span>
              </div>
              <button class="btn danger" style="padding:4px 9px;font-size:0.76rem;" onclick="removeBotPosition('${o.ticker}')">הסר מניה</button>
            </div>
          `;
        }).join("");
      }

      html += `<h3 style="margin:10px 0 6px;font-size:1rem;">עסקאות פתוחות (שערי כניסה ויציאה שנבחרו ורווח פר עסקה)</h3>`;
      if (!enrichedOpen.length) {
        html += `<div class="meta">אין פוזיציות פתוחות כרגע.</div>`;
      } else {
        html += enrichedOpen.map(p => `
          <div class="list-row">
            <div>
              <span class="badge">פעולה #${p.actNum}</span> <b>${p.ticker}</b> <span class="badge">${p.source || "אוטומטי"}</span><br/>
              <span class="meta">כניסה שנבחרה: <b>$${p.chosenEntry.toFixed(2)}</b> | עכשיו: $${p.curr.toFixed(2)} | יציאה שנבחרה: <b>$${p.chosenExit.toFixed(2)}</b> (דינמית $${p.dynExit.toFixed(2)})</span>
            </div>
            <div style="text-align:left;">
              <div class="${p.pnlDollar >= 0 ? "pos" : "neg"}">${p.pnlDollar >= 0 ? "+" : ""}$${p.pnlDollar.toFixed(2)} (${p.pnlPct >= 0 ? "+" : ""}${p.pnlPct.toFixed(1)}%)</div>
              <button class="btn danger" style="margin-top:4px;padding:4px 9px;font-size:0.76rem;" onclick="removeBotPosition('${p.ticker}')">הסר מניה</button>
            </div>
          </div>
        `).join("");
      }

      if (closedList.length) {
        html += `<h3 style="margin:14px 0 6px;font-size:1rem;">עסקאות סגורות (רווח/הפסד ממומש בתיק)</h3>`;
        html += closedList.slice().reverse().slice(0, 15).map((c, idx) => {
          const pnlD = Number(c.pnl_dollar || 0);
          const pnlP = Number(c.pnl_pct || 0);
          const actNum = c.action_num || (closedList.length - idx);
          const chEntry = Number(c.chosen_entry ?? c.entry ?? 0);
          const chExit = Number(c.chosen_exit ?? c.exit_price ?? 0);
          return `
            <div class="list-row closed-row">
              <div>
                <span class="badge gray">פעולה #${actNum}</span> <b>${c.ticker}</b> — כניסה: <b>$${chEntry.toFixed(2)}</b> ← יציאה: <b>$${chExit.toFixed(2)}</b> (מימוש $${Number(c.exit_price).toFixed(2)})<br/>
                <span class="meta">${c.exit_reason || c.result} • ${c.closed_at || ""}</span>
              </div>
              <div style="text-align:left;" class="${pnlD >= 0 ? "pos" : "neg"}">${pnlD >= 0 ? "+" : ""}$${pnlD.toFixed(2)} (${pnlP >= 0 ? "+" : ""}${pnlP.toFixed(1)}%)</div>
            </div>
          `;
        }).join("");
      }

      document.getElementById("botDemoContent").innerHTML = html;
    }

    loadSyncedData();
  </script>
</body>
</html>
