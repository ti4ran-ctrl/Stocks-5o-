name: 50 Agents Stock Scanner (Every 30m)

on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "מניות ספציפיות לבדיקה (מופרדות בפסיק, או ריק לסריקה אוטומטית)"
        required: false
        default: ""
      profit_target_pct:
        description: "אחוז יעד רווח (למשל 6 עבור 6%)"
        required: false
        default: "6"
      demo_mode:
        description: "תיק דמו: check | open | both"
        required: false
        default: "both"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 50 Agents Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST_TICKERS: ${{ secrets.WATCHLIST_TICKERS }}
          EXTRA_TICKERS: ${{ secrets.EXTRA_TICKERS }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
          INPUT_PROFIT_TARGET_PCT: ${{ github.event.inputs.profit_target_pct }}
          INPUT_DEMO_MODE: ${{ github.event.inputs.demo_mode }}
        run: python scanner.py

      - name: Push synced scan and demo data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_scan.json demo_portfolio.json
          if ! git diff --staged --quiet; then
            git commit -m "Sync Yahoo Finance scan and demo portfolio"
            git push
          fi
